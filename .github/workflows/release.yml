name: Release

# Publica en PyPI al hacer push de un tag `vX.Y.Z`.
# Usa Trusted Publishing (OIDC): NO requiere tokens ni secrets.
#
# Configúralo una sola vez en:
#   https://pypi.org/manage/account/publishing/
#   - PyPI project name: extraer-datos-ine
#   - Owner: rcfrias
#   - Repository name: ine-extractor-python
#   - Workflow name: release.yml
#   - Environment name: pypi
#
# Para publicar una versión:
#   1. Sube la versión en pyproject.toml (y __version__ en __init__.py).
#   2. git tag v1.0.1 && git push origin v1.0.1

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/extraer-datos-ine/
    permissions:
      id-token: write # requerido por Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
